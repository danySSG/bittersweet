[project]
name = "tastemap-backend"
version = "0.1.0"
description = "tastemap backend — acoustic portrait of music taste (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=49.0.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "librosa>=0.11.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "soundfile>=0.14.0",
    "uvicorn>=0.51.0",
    "ytmusicapi>=1.12.1",
]

# Own workspace root: keeps this project independent from the repo-root pyproject.toml.
[tool.uv.workspace]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "respx>=0.23.1",
]
